name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iam_showcase_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn clean verify -B -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: iam_showcase_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test

      - name: Upload Jacoco Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trivy resolves parent POMs/BOMs on its own; from shared runner IPs
      # Maven Central answers that with 429 Too Many Requests. Populating
      # ~/.m2 first (cached via setup-java) lets Trivy read them locally.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Resolve Maven dependencies for Trivy
        run: |
          mvn -B -q dependency:resolve -f backend/pom.xml
          mvn -B -q dependency:resolve -f keycloak/extensions/pom.xml

      # Auf einen Commit festgenagelt: ein beweglicher Verweis wie @master
      # fuehrt bei jedem Lauf ungeprueft den neuesten Stand der Action aus.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/pepperonas

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t $REGISTRY/iam-showcase-backend:latest backend/

      # Die URLs der Demo werden beim Build fest in das Frontend geschrieben.
      - name: Build frontend image
        run: |
          docker build -t $REGISTRY/iam-showcase-frontend:latest \
            --build-arg VITE_KEYCLOAK_URL=https://auth.iam-demo.celox.io \
            --build-arg VITE_API_BASE_URL=https://iam-demo.celox.io/api/v1 \
            frontend/

      - name: Build Keycloak image
        run: docker build -t $REGISTRY/iam-showcase-keycloak:latest keycloak/

      # Nur von main veroeffentlichen. Der VPS zieht diese Images und baut
      # selbst nichts (scripts/deploy-vps.sh).
      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in backend frontend keycloak; do
            docker tag $REGISTRY/iam-showcase-$image:latest $REGISTRY/iam-showcase-$image:${{ github.sha }}
            docker push $REGISTRY/iam-showcase-$image:latest
            docker push $REGISTRY/iam-showcase-$image:${{ github.sha }}
          done
