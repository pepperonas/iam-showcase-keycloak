# Speicher- und CPU-Grenzen sind bewusst knapp: der gesamte Stack ist auf
# rund 1 GB RAM gedeckelt (memswap_limit = mem_limit, also kein Swap).
name: iam-showcase

services:
  postgres:
    image: postgres:16-alpine
    container_name: iam-postgres
    command: >
      postgres
      -c shared_buffers=24MB
      -c max_connections=30
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_wal_size=128MB
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      APP_DB_NAME: ${APP_DB_NAME:-iam_showcase}
      APP_DB_USERNAME: ${APP_DB_USERNAME:-iam_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-iam_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    networks:
      - iam-network

  keycloak:
    image: ghcr.io/pepperonas/iam-showcase-keycloak:latest
    build:
      context: ../keycloak
      dockerfile: Dockerfile
    container_name: iam-keycloak
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_DB_POOL_INITIAL_SIZE: 1
      KC_DB_POOL_MIN_SIZE: 1
      KC_DB_POOL_MAX_SIZE: 8
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_BACKEND_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-backend-secret-change-in-prod}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_KC_HEAP: "-Xms96m -Xmx288m -XX:MaxMetaspaceSize=192m"
      JAVA_OPTS_APPEND: "-Xss512k"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 1.0
    networks:
      - iam-network

  backend:
    image: ghcr.io/pepperonas/iam-showcase-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: iam-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${APP_DB_NAME:-iam_showcase}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:-iam_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-iam_app}
      KEYCLOAK_ISSUER_URI: ${KC_HOSTNAME:-http://localhost:8180}/realms/iam-showcase
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/iam-showcase/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-backend-secret-change-in-prod}
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx144m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -Xss512k"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.75
    networks:
      - iam-network

  frontend:
    image: ghcr.io/pepperonas/iam-showcase-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${KC_HOSTNAME:-http://localhost:8180}
        VITE_KEYCLOAK_REALM: iam-showcase
        VITE_KEYCLOAK_CLIENT_ID: iam-frontend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: iam-frontend
    depends_on:
      - backend
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.25
    networks:
      - iam-network

networks:
  iam-network:
    driver: bridge

volumes:
  postgres-data:
