# Produktion (VPS): Images kommen fertig gebaut aus der CI (GHCR),
# auf dem Server wird nichts kompiliert. Ports nur auf loopback, davor nginx.
services:
  postgres:
    restart: unless-stopped

  keycloak:
    restart: unless-stopped
    environment:
      KC_HOSTNAME: https://auth.iam-demo.celox.io
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:9180:8080"

  backend:
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KEYCLOAK_ISSUER_URI: https://auth.iam-demo.celox.io/realms/iam-showcase
    ports:
      - "127.0.0.1:9080:8080"

  frontend:
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:80"
